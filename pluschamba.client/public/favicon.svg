<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Gradiente de azul oscuro a verde turquesa -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#2d8a9e"/>
      <stop offset="100%" stop-color="#3cb371"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo con esquinas redondeadas -->
  <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="url(#bgGradient)"/>
  
  <!-- Tres círculos blancos en disposición triangular -->
  <circle cx="16" cy="11" r="4" fill="#FFFFFF"/>
  <circle cx="11" cy="21" r="4" fill="#FFFFFF"/>
  <circle cx="21" cy="21" r="4" fill="#FFFFFF"/>
</svg>